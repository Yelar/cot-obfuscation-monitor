[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cot-obfuscation-compositional-repro"
version = "0.1.0"
description = "Reproduction code and data for compositional monitor-facts SDFT experiments"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=2,<3",
]

[project.optional-dependencies]
data = [
  "datasets==5.0.0",
  "huggingface-hub==1.24.0",
  "pyarrow>=20,<26",
]
evaluation = [
  "openai>=2.0,<3",
  "tinker==0.23.4",
]
generation = [
  "openai>=2.0,<3",
  "tenacity>=9,<10",
]
training = [
  "datasets==5.0.0",
  "huggingface-hub==1.24.0",
  "pyarrow>=20,<26",
  "tinker==0.23.4",
  "tinker-cookbook==0.5.2",
  "wandb>=0.20,<1",
]
full = [
  "datasets==5.0.0",
  "huggingface-hub==1.24.0",
  "openai>=2.0,<3",
  "pyarrow>=20,<26",
  "tenacity>=9,<10",
  "tinker==0.23.4",
  "tinker-cookbook==0.5.2",
  "wandb>=0.20,<1",
]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
cot-prepare = "cot_obfuscation_repro.prepare:main"
cot-evaluate = "cot_obfuscation_repro.evaluate:main"
cot-metrics = "cot_obfuscation_repro.metrics:main"
cot-aggregate = "cot_obfuscation_repro.aggregate:main"
cot-select = "cot_obfuscation_repro.select:main"
cot-summarize = "cot_obfuscation_repro.summarize:main"
cot-plots = "cot_obfuscation_repro.plots:main"
cot-audit = "cot_obfuscation_repro.audit:main"
cot-workflow = "cot_obfuscation_repro.workflow:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
